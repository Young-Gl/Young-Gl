name: Refresh project list

on:
  schedule:
    - cron: "0 3 * * *"        # every day at 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_projects.py"
      - ".github/workflows/projects.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate projects section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_projects.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: refresh project list"
          git push
